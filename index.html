<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wedding Invitation</title>
    <meta
      name="description"
      content="A personalized wedding invitation website ready to be customized."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=20260824u" />
  </head>
  <body class="landing-page">
    <div class="page-shell page-shell--landing">
      <header class="hero hero--landing">
        <div class="invitation-transition" id="invitation-transition" aria-hidden="true" hidden></div>
        <div class="hero__image-layer" aria-hidden="true"></div>
        <div class="hero__ornament hero__ornament--top" aria-hidden="true"></div>
        <div class="hero__ornament hero__ornament--bottom" aria-hidden="true"></div>
        <div class="hero__veil"></div>
        <div class="hero__spark hero__spark--one" aria-hidden="true"></div>
        <div class="hero__spark hero__spark--two" aria-hidden="true"></div>
        <div class="hero__content hero__content--cover">
          <p class="eyebrow">Together with us</p>
          <h1 class="couple-names">
            <span>Anjalika</span>
            <span class="ampersand">&</span>
            <span>Kaveesha</span>
          </h1>
          <p class="hero__invite">invite you to celebrate a beautiful beginning</p>
          <div class="hero__date-card">
            <p class="hero__date">Thursday, 15 October 2026</p>
            <p class="hero__time">At 9:30 AM onwards</p>
          </div>
          <div class="hero__actions">
            <a class="button button--primary view-invitation" href="details.html">Open Invitation</a>
            <a class="button button--secondary hero__admin-link" id="open-guest-editor" href="details.html?edit=1" hidden>
              Open Guest Link Editor
            </a>
          </div>
          <p class="hero__note">A hand-drawn memory, a real celebration, one beautiful new chapter.</p>
        </div>
      </header>
    </div>

    <script src="script.js?v=20260824u"></script>
  </body>
</html>
